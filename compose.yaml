
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: supplier_quotation
      DB_USERNAME: supplier_user
      DB_PASSWORD: supplier_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi; if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi; php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: supplier_quotation
      MYSQL_USER: supplier_user
      MYSQL_PASSWORD: supplier_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
